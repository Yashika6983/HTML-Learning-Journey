<!DOCTYPE html>
<html>
   <head>
      <title>CSS Class Example</title>

      <style>
         .text{
            color:rgb(0,0,100);
         }
         .text1{
            color:#000000
         }
      </style>
   </head>

   <body>
      <h1>My computer</h1>

      <p class="text">I am learning html.</p>
      <p class="text1">I am learning CSS.</p>
      <p class="text">I am learning C++</p>
      <p>This paragraph has no class</p>
   </body>
</html>
