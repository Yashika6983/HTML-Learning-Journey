<!DOCTYPE html>
<html>
<head>
    <title>Outline Styles</title>

    <style>
        p.solid {
            border-style: double;
            border-color: black;
            outline: 2px solid blue;
        }

        p.dotted {
            border-style: double;
            border-color: black;
            outline: 2px dotted blue;
        }

        p.dash {
            border-style: double;
            border-color: black;
            outline: 2px dashed blue;
        }

        p.double {
            border-style: double;
            border-color: black;
            outline: 2px double blue;
        }
    </style>
</head>

<body>
    <p class="solid">This is a paragraph to learn about solid outline.</p>

    <p class="dotted">This is a paragraph to learn about dotted outline.</p>

    <p class="dash">This is a paragraph to learn about dashed outline.</p>

    <p class="double">This is a paragraph to learn about double outline.</p>
</body>
</html>
