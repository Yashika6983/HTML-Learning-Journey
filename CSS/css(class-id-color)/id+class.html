<!DOCTYPE html>
<html>
   <head>
      <title>ID and class Example</title>
      <style>
         #heading{
            color:blue;
         }
         .text{
            color:green;
         }
         #special{background-color: yellow;}
      </style>
   </head>

   <body>
      <h1 id="heading">My computer institute</h1>

      <p class="text">We teach html and css</p>
      <p id ="special">This is a special paragraph</p>
      <p class="text">Learn coding with practice</p>
   </body>
</html>
