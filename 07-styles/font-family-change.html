<!DOCTYPE html>
<html>
<head>
  <title>Change Font</title>
</head>
<body>

  <h1 style="font-family: Arial;">This is Arial font</h1>

  <p style="font-family: 'Times New Roman';">This is Times New Roman font</p>

  <p style="font-family: 'Courier New';">This is Courier New font</p>

  <p style="font-family: Verdana; font-size: 20px; color: blue;">
    This is Verdana, 20px size, blue colour
  </p>

</body>
</html>
