<!DOCTYPE html>
<html>
<head>
    <title>CSS ID Example</title>

    <style>
        #heading {
            color: blue;
        }

        #paragraph {
            color: red;
        }

        #special {
            background-color: yellow;
        }
    </style>

</head>
<body>

    <h1 id="heading">My Computer Class</h1>

    <p id="paragraph">I am learning CSS.</p>

    <p id="special">This is my special paragraph.</p>

</body>
</html>
