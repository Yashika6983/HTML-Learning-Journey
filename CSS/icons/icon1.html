<!DOCTYPE html>
<html>
    <head>
        <title>MY icon</title>

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

        <style>
            body {
                text-align: center;
                font-family: Arial;
            }

            .icon {
                font-size: 50px;
                margin: 20px;
            }

            .home { color: blue; }
            .user { color: green; }
            .phone { color: red; }
            .camera { color: orange; }
            .insta { color: pink; }
        </style>
    </head>

    <body>
        <h1>My website icons</h1>

        <i class="fa-solid fa-house icon home"></i>
        <i class="fa-solid fa-user icon user"></i>
        <i class="fa-solid fa-phone icon phone"></i>
        <i class="fa-solid fa-camera icon camera"></i>
        <i class="fa-brands fa-instagram icon insta"></i>

    </body>
</html>
