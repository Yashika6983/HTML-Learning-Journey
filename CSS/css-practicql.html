<!DOCTYPE html>
<html>
<head>
    <title>CSS Practical</title>

    <style>

/* 1. CSS Universal Selector */
* {
    box-sizing: border-box;
}

/* 2. CSS Element Selector */
body {
    font-family: Arial;
    background-color: lightyellow;
}

/* 3. CSS ID Selector */
#header {
    background-color: navy;
    color: white;
    text-align: center;
    padding: 20px;
}

/* 4. CSS Class Selector */
.box {
    background-color: lightblue;
    color: darkblue;
}

/* 5. CSS Colors */
h2 {
    color: crimson;
}

/* 6. CSS Background */
.container {
    background-color: white;
}

/* 7. CSS Borders */
.container {
    border: 3px solid green;
    border-radius: 10px;
}

/* 8. CSS Margins */
.container {
    margin: 30px;
}

/* 9. CSS Padding */
.container {
    padding: 25px;
}

/* 10. CSS Text */
p {
    font-size: 18px;
    text-align: justify;
}

/* 11. CSS Links */
a {
    color: red;
    text-decoration: none;
}

/* 12. CSS Hover */
a:hover {
    color: blue;
    text-decoration: underline;
}

    </style>
</head>

<body>

    <div id="header">
        <h1>N2P COMPUTER CENTER</h1>
        <p>Learn Computer Skills</p>
    </div>

    <div class="container">

        <h2>Welcome to N2P</h2>

        <div class="box">
            <h3>Our Courses</h3>
            <p>ADCA | DCA | TALLY | HTML | CSS</p>
        </div>

        <h2>About Us</h2>

        <p>
            N2P Computer Center provides computer
            education and practical training to students.
            We teach Basic Computer, Advanced Excel,
            Web Development and Programming.
        </p>

        <a href="#">Read More</a>

    </div>

</body>
</html>
