<!DOCTYPE html>
<html>
<head>
    <title>Advanced CSS Colors</title>

    <style>
        body {
            background-color: #F1F5F9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: lightgrey;
            padding: 25px;
            max-width: 600px;
            margin: auto;
            border-radius: 15px;
            border: 2px solid #CBD5E1;
        }

        h1 {
            color: #1D4ED8;
        }

        .rgb-text {
            color: rgb(220, 38, 38);
        }

        .hex-text {
            color: #7E22CE;
        }

        .rgba-box {
            background-color: rgba(34, 197, 94, 0.75);
            padding: 15px;
            border-radius: 8px;
        }

        .gradient-box {
            background: linear-gradient(to right, #2563EB, #9333EA);
            color: white;
            padding: 18px;
            border-radius: 8px;
        }

        .btn {
            background-color: #0F766E;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #F97316;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>N2P Computer Center</h1>

        <p class="rgb-text">
            This text uses RGB Color.
        </p>

        <p class="hex-text">
            This text uses HEX Color.
        </p>

        <div class="rgba-box">
            RGBA Color with Transparency
        </div>

        <br>

        <div class="gradient-box">
            CSS Linear Gradient Effect
        </div>

        <br>

        <button class="btn">Explore Courses</button>

    </div>

</body>
</html>
